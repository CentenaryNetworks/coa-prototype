<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Product · Chiefs of Angels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="coa.css">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0}</style>
</head>
<body>
<main id="top">
  <div class="wrap">
    <div id="crumbs"></div>
    <div class="pdp">
      <div class="gallery">
        <div class="thumbs" id="thumbs" aria-label="Product images"></div>
        <div class="stage" id="stage"></div>
      </div>
      <div class="p-info" id="info"></div>
    </div>
  </div>
  <section class="p-section" id="storySec" hidden></section>
  <section class="p-section">
    <div class="wrap">
      <div class="sec-head"><div><span class="eyebrow" id="lookEye">You may also like</span><h2 class="display" id="lookH">Wear it with</h2></div><a class="link-arrow" id="lookLink" href="collection.html#shop">Shop all</a></div>
      <div class="p-grid4" id="look"></div>
    </div>
  </section>
  <section class="p-section" id="recentSec" hidden>
    <div class="wrap">
      <div class="sec-head"><div><span class="eyebrow">Your trail</span><h2 class="display">Recently viewed</h2></div></div>
      <div class="p-grid4" id="recent"></div>
    </div>
  </section>
</main>

<aside class="sheet" id="fitSheet" aria-label="Size and fit" aria-hidden="true">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h2>Size &amp; fit</h2><button class="icon-btn" data-close aria-label="Close size and fit"><svg><use href="#i-x"/></svg></button></div>
  <div id="fitBody"></div>
</aside>

<div class="sticky-buy" id="sticky" aria-hidden="true">
  <div class="wrap">
    <img id="sImg" src="" alt="">
    <div class="nm"><b id="sName"></b><span id="sMeta"></span></div>
    <button class="btn solid" id="sAdd">Add to bag</button>
  </div>
</div>

<script src="coa-data.js"></script>
<script src="coa.js"></script>
<script>
(function(){
const {P,BY,C,TYPES,R,$,esc,img,priceHTML,card,add,openBag,closeAll,mount,store,wish,curl,addWorkingDays,fmt,ar,crumbs,hashFor,DIARIES,returnable,payflex}=COA;
mount("shop");

let id=hashFor("product.html");
if(!BY[id]) id="flatground-bomber-jacket";
const p=BY[id];
let size=p.one?"One size":null, view=0;
document.title=`${p.n} · Chiefs of Angels`;

const homeCol=p.cols.find(c=>c!=="sale") || (p.type==="jackets"?"jackets":p.type==="headgear"?"accessories":p.type==="sweaters"?"outerwear":"loungewear");
const col=C[homeCol];
$("#crumbs").innerHTML=crumbs([[col.t,curl(homeCol)],[p.n]]);

/* gallery: every photo plus a close-up crop of the first */
const views=p.imgs.map((im,i)=>({src:im,lbl:i===0?"Front":`View ${i+1}`}));
views.push({src:p.imgs[0],lbl:"Detail",zoom:true});
function gallery(){
  $("#thumbs").innerHTML=views.map((v,i)=>`<button aria-pressed="${i===view}" data-v="${i}" aria-label="${v.lbl}"><img src="${img(v.src)}" alt="" style="${v.zoom?"transform:scale(2.2);transform-origin:50% 40%":""}"><span class="lbl">${v.lbl}</span></button>`).join("");
  const v=views[view];
  $("#stage").innerHTML=`${p.tag?`<span class="tag${p.sale?" sale":""}">${p.tag}</span>`:""}<button class="wish${wish.has(p.id)?" on":""}" data-wid="${p.id}" aria-label="Save ${esc(p.n)}" aria-pressed="${wish.has(p.id)}"><svg><use href="#i-heart"/></svg></button><img src="${img(v.src)}" alt="${esc(p.n)}, ${v.lbl.toLowerCase()}" style="${v.zoom?"transform:scale(2.1);transform-origin:50% 40%":""}"><span class="hint">${matchMedia("(hover:hover)").matches?"Hover to zoom":"Tap to zoom"}</span>`;
}
gallery();
$("#thumbs").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; view=+b.dataset.v; gallery() });
const stage=$("#stage");
function zoomAt(e){ const r=stage.getBoundingClientRect(), im=stage.querySelector("img"); im.style.transformOrigin=`${(e.clientX-r.left)/r.width*100}% ${(e.clientY-r.top)/r.height*100}%`; }
stage.addEventListener("mousemove",e=>{ if(e.target.closest(".wish")) return; stage.classList.add("zoom"); zoomAt(e) });
stage.addEventListener("mouseleave",()=>{ stage.classList.remove("zoom"); const im=stage.querySelector("img"); if(im && !views[view].zoom) im.style.transformOrigin="" });
stage.addEventListener("click",e=>{ if(e.target.closest(".wish")||matchMedia("(hover:hover)").matches) return; stage.classList.toggle("zoom"); zoomAt(e) });

/* dispatch window, counted in working days from today */
const d5=addWorkingDays(new Date(),5), d7=addWorkingDays(new Date(),7);
const fitWord=p.det.find(x=>/fit|cropped|sleeveless|barrel|boxy/i.test(x));
const storyCol=p.cols.find(c=>C[c]&&C[c].story);

$("#info").innerHTML=`
  <div>
    <span class="eyebrow"><a href="${curl(homeCol)}">${col.t}</a> · ${TYPES[p.type]}</span>
    <h1 class="display">${esc(p.n)}</h1>
  </div>
  <p class="story">${esc(p.l)}</p>
  <div><div class="p-price">${priceHTML(p)}<small>${p.was?`Save ${R(p.was-p.p)} · `:""}VAT included</small></div><p class="payflex-line">${payflex(p.p)}</p></div>
  <div>
    <div class="opt-head"><span>Size: <b id="sizeLbl">${p.one?"One size":"choose one"}</b></span>${p.one?"":`<button id="fitBtn">Size &amp; fit</button>`}</div>
    ${p.one?"":`<div class="p-sizes" id="psizes" role="group" aria-label="Choose a size" style="grid-template-columns:repeat(${p.sizes.length},minmax(0,1fr))">${p.sizes.map(s=>`<button data-s="${s}" aria-pressed="false">${s}</button>`).join("")}</div>`}
    ${p.sizes.length<5&&!p.one?`<p style="margin:10px 0 0;font-size:13px;color:var(--smoke)">Available in ${p.sizes.join(", ")} only.</p>`:""}
  </div>
  <div class="add-row">
    <button class="btn dark" id="addBtn" aria-disabled="${!size}">${size?`Add to bag · ${R(p.p)}`:"Select a size"} ${ar}</button>
    <button class="wish${wish.has(p.id)?" on":""}" data-wid="${p.id}" aria-label="Save ${esc(p.n)}" aria-pressed="${wish.has(p.id)}"><svg><use href="#i-heart"/></svg></button>
  </div>
  ${returnable(p)?"":`<p class="final-sale">Final sale: ${p.type==="headgear"?"headgear":"sale items"} can’t be returned or exchanged.</p>`}
  <div class="dispatch">
    <svg><use href="#i-needle"/></svg>
    ${p.mto?`<div><b>Made for you, dispatched ${fmt(d5)} – ${fmt(d7)}</b><span>Cut and finished by hand once you order: 5–7 working days, counted from today, skipping weekends and public holidays.</span></div>`
           :`<div><b>Ready-made piece</b><span>This item isn’t listed as made to order. Its dispatch time is confirmed at checkout.</span></div>`}
  </div>
  <div class="acc">
    <details open><summary>Details</summary><div class="in">${p.det.length?`<ul>${p.det.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<p>${esc(p.l)}</p>`}</div></details>
    <details><summary>The story</summary><div class="in"><p>${esc(p.d||p.l)}</p>${p.cols.filter(c=>c!=="sale").map(c=>`<p>Part of <a href="${curl(c)}" style="text-decoration:underline;text-underline-offset:3px">${C[c].t}</a>. ${esc(C[c].d)}</p>`).join("")}</div></details>
    <details id="delivery"><summary>Delivery &amp; returns</summary><div class="in"><p>${p.mto?"This piece is made to order and dispatched within 5–7 working days.":"Dispatch time is confirmed at checkout."} We ship with The Courier Guy (standard shipping); the fee is worked out at checkout from your address. You can also collect from our Melrose flagship store, with a shipping fee still applied.</p><p>${returnable(p)?"Exchanges and returns are accepted within 14 calendar days of purchase with your digital receipt, as long as the piece is unused and undamaged.":`<b>This piece can’t be returned or exchanged.</b> ${p.type==="headgear"?"Headgear":"Sale and discounted items"} are excluded from our exchange policy.`}</p><p><a href="faq.html#delivery" style="text-decoration:underline;text-underline-offset:3px">Read the delivery and exchange FAQ</a></p></div></details>
  </div>
  <div class="share"><button id="copyLink">Copy link</button><a href="contact.html" style="text-decoration:underline;text-underline-offset:3px">Ask about this piece</a><span id="copied" aria-live="polite"></span></div>
`;

function setSize(s){
  size=s; $("#sizeLbl").textContent=s;
  document.querySelectorAll("#psizes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s===s));
  const a=$("#addBtn"); a.setAttribute("aria-disabled","false"); a.firstChild.textContent=`Add to bag · ${R(p.p)} `;
  $("#sMeta").textContent=`${R(p.p)} · Size ${s}`; $("#sAdd").textContent="Add to bag";
}
function tryAdd(){
  if(!size){ const g=$("#psizes"); g.classList.remove("shake"); void g.offsetWidth; g.classList.add("shake"); $("#sizeLbl").textContent="pick a size first"; g.scrollIntoView({block:"center",behavior:"smooth"}); return }
  add(p.id,size); setTimeout(openBag,350);
}
const ps=$("#psizes"); if(ps) ps.addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) setSize(b.dataset.s) });
$("#addBtn").onclick=tryAdd; $("#sAdd").onclick=tryAdd;

const fb=$("#fitBtn");
if(fb) fb.onclick=()=>{
  $("#fitBody").innerHTML=`<p class="story" style="font-size:22px;margin:14px 0 0">${fitWord?`${esc(fitWord)}.`:"Cut to the Chiefs of Angels standard block."}</p>
  <ul class="fitlist">${p.sizes.map(s=>`<li><span>${s}</span><span style="color:var(--smoke)">${{XS:"Extra Small",S:"Small",M:"Medium",L:"Large",XL:"Extra Large"}[s]||s}</span></li>`).join("")}</ul>
  <p class="note">The measurement chart (chest, waist and length for each size) is to be supplied by Chiefs of Angels and will appear here on every product.</p>
  <p style="margin-top:16px">Between sizes? <a href="contact.html" style="text-decoration:underline;text-underline-offset:3px">Ask the studio</a> before you order.</p>`;
  $("#fitSheet").classList.add("on"); $("#scrim").classList.add("on"); $("#fitSheet").setAttribute("aria-hidden","false");
};
$("#fitSheet").addEventListener("click",e=>{ if(e.target.closest("[data-close]")) closeAll() });
$("#copyLink").onclick=async()=>{
  const url=location.href.split("#")[0]+"#"+p.id;
  try{ await navigator.clipboard.writeText(url); $("#copied").textContent="Link copied" } catch(e){ $("#copied").textContent=url }
};

/* the story band: link a product to its Diaries entry */
const d=DIARIES.find(x=>x.prods&&x.prods.includes(p.id)) || (storyCol && DIARIES.find(x=>x.id===C[storyCol].story));
if(d){
  const s=$("#storySec"); s.hidden=false; s.classList.add("p-story");
  s.innerHTML=`<div class="wrap story-grid"><img src="${img(d.cover)}" alt=""><div class="story-copy"><span class="eyebrow">From the Diaries · ${esc(d.k)}</span><h2 class="display">${esc(d.t)}</h2><p class="story">${esc(d.dek)}</p><a class="btn ghost" href="diary.html#${d.id}">Read the story ${ar}</a></div></div>`;
}

/* you may also like: same collection first, then a different type to wear it with */
const pool=P.filter(x=>x.id!==p.id);
const scored=pool.map(x=>({x,s:(p.cols.filter(c=>c!=="sale").some(c=>x.cols.includes(c))?3:0)+(x.type!==p.type?1:0)+(x.type===p.type?.4:0)+(x.isNew?.2:0)}))
  .sort((a,b)=>b.s-a.s||a.x.o-b.x.o).slice(0,4).map(o=>o.x.id);
$("#look").innerHTML=scored.map(i=>card(i)).join("");
$("#lookLink").href=curl(homeCol); $("#lookLink").innerHTML=`Shop ${esc(col.t)} ${ar}`;
if(p.cols.some(c=>c!=="sale")){ $("#lookEye").textContent=`From ${col.t}`; $("#lookH").textContent="Complete the look" }

let rec=store.get("coa-recent",[]).filter(x=>x!==p.id&&BY[x]);
if(rec.length){ $("#recentSec").hidden=false; $("#recent").innerHTML=rec.slice(0,4).map(i=>card(i)).join("") }
store.set("coa-recent",[p.id,...rec].slice(0,8));

$("#sImg").src=img(p.imgs[0]); $("#sName").textContent=p.n; $("#sMeta").textContent=size?`${R(p.p)} · ${size}`:`${R(p.p)} · choose a size`;
if(!size) $("#sAdd").textContent="Choose size";
if("IntersectionObserver" in window){
  const st=$("#sticky");
  new IntersectionObserver(([en])=>{ const below=en.boundingClientRect.top>0; const on=!en.isIntersecting && (below ? innerWidth<=640 : scrollY>300); st.classList.toggle("on",on); st.setAttribute("aria-hidden",!on) }).observe($("#addBtn"));
}
addEventListener("hashchange",()=>location.reload());
})();
</script>
</body>
</html>
